name: "Manual AI Automation Dispatcher"

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Choose AI Pipeline to execute"
        required: true
        default: "trends-hindi"
        type: choice
        options:
          - "trends-hindi"
          - "trends-en"
          - "viral-videos"
          - "visual-stories"
          - "horoscope"
          - "all"

jobs:
  dispatch-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "ai-engine/package.json"

      - name: Install Dependencies
        run: |
          cd ai-engine
          npm ci

      - name: Run Selected Pipeline (${{ github.event.inputs.pipeline }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY || 'cb322ea2cf9e5c848c5876748c7ed3bf84fcb' }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || 'arvind.shukla64@gmail.com' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '5294ebf66d98c4fb5b5ea11a27e9ce09' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '84e0866f-fbd1-4527-9543-9ed7e727e2ee' }}
        run: |
          cd ai-engine
          npx tsx src/cli.ts ${{ github.event.inputs.pipeline }}
