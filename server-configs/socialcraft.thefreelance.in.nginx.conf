server {
    server_name socialcraft.thefreelance.in;
    client_max_body_size 50M;

    # Backend API endpoints (for contact form submission)
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static & Chunks optimization
    location /_next/static/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 365d;
    }

    # Main Frontend Proxy
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/socialcraft.thefreelance.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/socialcraft.thefreelance.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = socialcraft.thefreelance.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name socialcraft.thefreelance.in;
    return 404; # managed by Certbot


}