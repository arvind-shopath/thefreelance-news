server {
    server_name thefreelance.in www.thefreelance.in;

    # Allow up to 50M uploads
    client_max_body_size 50M;

    # Next.js Auth API endpoints
    location /api/auth/ {
        proxy_pass http://localhost:3002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All Sitemaps & Feeds served by Backend (Hindi, English, News, Web-Stories)
    location ~* ^/(.*sitemap.*\.xml|feed.*\.xml|rss.*\.xml|robots\.txt|9c3b88b48f984a9ba1409df8c8a1e2f7\.txt)$ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Dedicated English sub-path rewrite for sitemaps/feeds
    location = /en/sitemap.xml {
        proxy_pass http://localhost:4000/sitemap-en.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /en/news-sitemap.xml {
        proxy_pass http://localhost:4000/news-sitemap-en.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /en/feed.xml {
        proxy_pass http://localhost:4000/feed-en.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ads.txt served from frontend public folder if exists, or fallback
    location = /sw.js {
        alias /var/www/thefreelance.in/frontend/public/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /ads.txt {
        alias /var/www/thefreelance.in/frontend/public/ads.txt;
        default_type text/plain;
        access_log off;
    }

    # Next.js Static & Chunks optimization
    location /_next/static/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 365d;
    }

    # Direct high-performance static media uploads serving
    location /uploads/ {
        alias /var/www/thefreelance.in/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Main Frontend Proxy
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thefreelance.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thefreelance.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.thefreelance.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = thefreelance.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name thefreelance.in www.thefreelance.in;
    return 301 https://$host$request_uri;
}
